name: ELVORA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Backup Firebase config
        run: |
          mkdir -p "$RUNNER_TEMP/elvora-config"
          cp android/app/google-services.json "$RUNNER_TEMP/elvora-config/google-services.json"

      - name: Recreate Android project
        run: |
          rm -rf android
          CORE_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          npm install "@capacitor/android@$CORE_VERSION"
          npx cap add android

      - name: Configure Google authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")
          content = path.read_text()

          settings = """
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          """

          if "rgcfaIncludeGoogle" not in content:
              match = re.search(r"ext\s*\{", content)
              if not match:
                  raise SystemExit("Gradle ext block not found")
              content = content[:match.end()] + settings + content[match.end():]
              path.write_text(content)

          print("Google authentication settings added")
          PY

      - name: Restore Firebase config
        run: |
          mkdir -p android/app
          cp "$RUNNER_TEMP/elvora-config/google-services.json" android/app/google-services.json
          npx cap sync android

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          content = root.read_text()

          if "com.google.gms:google-services" not in content:
              pattern = r"(buildscript\s*\{[\s\S]*?dependencies\s*\{)"
              updated, count = re.subn(
                  pattern,
                  r"\1\n        classpath 'com.google.gms:google-services:4.4.2'",
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Root Gradle dependencies block not found")
              root.write_text(updated)

          app_content = app.read_text()

          if "com.google.gms.google-services" not in app_content:
              app.write_text(
                  app_content + "\napply plugin: 'com.google.gms.google-services'\n"
              )

          print("Firebase Gradle plugin configured")
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate signing fingerprints
        run: |
          cd android
          ./gradlew signingReport | tee signing-report.txt

          SHA1=$(awk '/Variant: debug/{flag=1} flag && /SHA1:/{print $2; exit}' signing-report.txt)
          SHA256=$(awk '/Variant: debug/{flag=1} flag && /SHA-256:/{print $2; exit}' signing-report.txt)

          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "Certificate fingerprints not found"
            exit 1
          fi

          {
            echo "### ELVORA Android Debug Certificate"
            echo ""
            echo "SHA-1: \`$SHA1\`"
            echo ""
            echo "SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELVORA-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
